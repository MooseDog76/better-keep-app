<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>New notebook</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <h1>Save to AbleMemo</h1>
  <form id="form">
    <label><span class="label">Name your new notebook</span><input id="name" maxlength="120" required autofocus></label>
    <p class="problem" id="problem" role="alert" hidden></p>
    <div class="row">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="main" id="create">Create and save</button>
    </div>
  </form>
</main>
<script type="module" src="newnb.js"></script>
</body>
</html>
